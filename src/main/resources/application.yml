spring:
  application:
    name: claims-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claims}
    username: ${DB_USERNAME:claims_app}
    password: ${DB_PASSWORD:localdev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health